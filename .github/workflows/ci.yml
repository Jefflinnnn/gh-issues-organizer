name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # --locked fails if uv.lock is out of date with pyproject.toml, so CI
      # always tests the versions recorded in the lockfile.
      - name: Install project
        if: hashFiles('pyproject.toml') != ''
        run: uv sync --locked --all-extras --dev

      # Ruff comes from uv.lock once the project exists; before that, uvx.
      - name: Ruff lint
        run: |
          if [ -f pyproject.toml ]; then uv run ruff check .
          else uvx ruff check .; fi
      - name: Ruff format check
        run: |
          if [ -f pyproject.toml ]; then uv run ruff format --check .
          else uvx ruff format --check .; fi

      # The steps below switch on automatically once pyproject.toml lands.

      - name: Type check (mypy)
        if: hashFiles('pyproject.toml') != ''
        run: uv run mypy .

      - name: Tests (pytest)
        if: hashFiles('pyproject.toml') != ''
        # Exit code 5 means "no tests collected"; allowed only until tests exist.
        run: uv run pytest || [ $? -eq 5 ]
